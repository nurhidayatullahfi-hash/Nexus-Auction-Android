name: Build Nexus Auction APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Tidak perlu install SDK manual, runner sudah punya semua.
      
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # [FIX] Buat file gradlew terlebih dahulu karena tidak ada di repo
      - name: Buat Gradle Wrapper
        run: gradle wrapper

      # [FIX] Sekarang pakai ./gradlew seperti biasa
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      # DEBUG: Cek ukuran APK hasil build
      - name: Debug Cek APK
        run: |
          echo "=== Daftar file APK ==="
          ls -la app/build/outputs/apk/debug/
          echo "=== Cek tipe file ==="
          file app/build/outputs/apk/debug/*.apk || echo "APK tidak ditemukan"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Auction-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
