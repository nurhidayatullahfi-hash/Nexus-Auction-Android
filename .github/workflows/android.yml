name: Build Nexus Auction APKon:  push:    branches:      - main  workflow_dispatch:jobs:  build:    runs-on: ubuntu-latest    steps:      - name: Checkout repository        uses: actions/checkout@v4      - name: Setup JDK        uses: actions/setup-java@v5        with:          distribution: temurin          java-version: '17'      - name: Setup Gradle        uses: gradle/actions/setup-gradle@v4      - name: Check index.html        run: |          echo "Checking game assets..."          if [ ! -f "app/src/main/assets/index.html" ]; then            echo "ERROR: app/src/main/assets/index.html tidak ditemukan!"            exit 1          fi          echo "SUCCESS: index.html ditemukan."          ls -lh app/src/main/assets/index.html      - name: Build APK        run: |          chmod +x ./gradlew          ./gradlew --no-daemon --stacktrace assembleDebug      - name: Check APK        run: |          APK="app/build/outputs/apk/debug/app-debug.apk"          if [ ! -f "$APK" ]; then            echo "ERROR: APK tidak ditemukan!"            exit 1          fi          echo "APK berhasil dibuat:"          ls -lh "$APK"      - name: Check index.html inside APK        run: |          APK="app/build/outputs/apk/debug/app-debug.apk"          echo "Checking assets/index.html inside APK..."          if unzip -l "$APK" | grep -q "assets/index.html"; then            echo "SUCCESS: assets/index.html ADA DI DALAM APK."          else            echo "ERROR: assets/index.html TIDAK ADA DI DALAM APK!"            exit 1          fi      - name: Upload APK        uses: actions/upload-artifact@v4        with:          name: Nexus-Auction-debug-apk          path: app/build/outputs/apk/debug/app-debug.apk          if-no-files-found: error
