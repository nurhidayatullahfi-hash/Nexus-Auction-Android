name: Build Nexus Auction APKon:  push:    branches:      - main  workflow_dispatch:jobs:  build:    runs-on: ubuntu-latest    steps:      - name: Checkout repository        uses: actions/checkout@v4      - name: Setup JDK 17        uses: actions/setup-java@v5        with:          distribution: temurin          java-version: '17'      - name: Setup Gradle        uses: gradle/actions/setup-gradle@v4      - name: Verify index.html        run: |          echo "Checking Android assets..."          if [ ! -f "app/src/main/assets/index.html" ]; then            echo "ERROR: app/src/main/assets/index.html NOT FOUND!"            exit 1          fi          echo "index.html found."          ls -lh app/src/main/assets/index.html      - name: Verify Android project        run: |          echo "Checking project structure..."          test -f app/src/main/AndroidManifest.xml          test -f app/src/main/java/com/nexusauction/game/MainActivity.java          echo "Project structure OK."      - name: Build Debug APK        run: |          chmod +x ./gradlew          ./gradlew --no-daemon --stacktrace assembleDebug      - name: Verify APK contains index.html        run: |          APK="app/build/outputs/apk/debug/app-debug.apk"          if [ ! -f "$APK" ]; then            echo "ERROR: APK was not generated!"            exit 1          fi          echo "APK generated:"          ls -lh "$APK"          echo ""          echo "Checking APK contents..."          unzip -l "$APK" | grep "assets/index.html"          if [ $? -ne 0 ]; then            echo "ERROR: assets/index.html is NOT inside APK!"            exit 1          fi          echo ""          echo "SUCCESS: assets/index.html is inside APK."      - name: Show APK size        run: |          ls -lh app/build/outputs/apk/debug/app-debug.apk      - name: Upload APK        uses: actions/upload-artifact@v4        with:          name: Nexus-Auction-debug-apk          path: app/build/outputs/apk/debug/app-debug.apk          if-no-files-found: error
