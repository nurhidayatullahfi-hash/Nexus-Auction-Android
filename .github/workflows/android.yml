name: Build Nexus Auction APK
     on:  workflow_dispatch:  push:    branches: ["main", "master"]permissions:  contents: readjobs:  build:    runs-on: ubuntu-latest    steps:      - name: Checkout        uses: actions/checkout@v4      - name: Check game assets        run: |          echo "Checking game files..."          test -f app/src/main/assets/index.html          echo "index.html found:"          ls -lh app/src/main/assets/index.html          echo "Assets directory:"          find app/src/main/assets -maxdepth 3 -type f -print          echo "index.html size:"          wc -c app/src/main/assets/index.tions/setup-java@v4       JDK 17        uses: actions/setup-java@v4        with:          distribution: temurin          java-version: "17"      - name: Set up Android SDK        uses: android-actions/setup-android@v3      - name: Install Android SDK packages        run: |          yes | sdkmanager --licenses >/dev/null || true          sdkmanager \            "platform-tools" \            "platforms;android-35" \            "build-tools;35.0.0"      - name: Set up Gradle 8.9        uses: gradle/actions/setup-gradle@v4        with: n        gradle-version: "8.9"      - name: Clean previous build        run: |          gradle --no-daemon clean      - name: Build debug APK        run: |          gradle --no-daemon --stacktrace assembleDebug      - name: Verify APK contains game assets        run: |          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)          if [ -z "$APK" ]; then            echo "ERROR: APK tidak ditemukan."            exit 1          fi          echo "APK:"          ls -lh "$APK"          echo "APK size:"          du -h "$APK"          echo "Checking index.html inside APK..."          if unzip -l "$APK" | grep -q "assets/index.html"; then            echo "SUCCESS: assets/index.html ditemukan di dalam APK."          else            echo "ERROR: assets/index.html TIDAK ditemukan di dalam APK."            echo "APK contents:"            unzip -l "$APK" | head -n 100            exit 1          fi      - name: Upload APK        uses: actions/upload-artifact@v4        with:          name: Nexus-Auction-debug-apk          path: app/build/outputs/apk/debug/*.apk          if-no-files-found: error
